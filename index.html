<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alexandra Hartinger | Portfolio</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', sans-serif;
      background: black;
      color: white;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 10;
      background: black;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      box-sizing: border-box;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    header .logo {
      font-size: 1.8rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 30px;
      font-size: 1rem;
      text-transform: uppercase;
      font-weight: bold;
    }

    nav a:hover {
      color: #aaa;
    }

    .section {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 60px;
      box-sizing: border-box;
    }

    .section video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .section .overlay {
      position: relative;
      z-index: 2;
      max-width: 700px;
      text-align: left;
    }

    .section h1 {
      font-size: 2.5vw;
      margin: 0 0 20px 0;
      color: white;
      animation: fadeUp 1.2s ease forwards;
    }

    .section .button {
      display: inline-block;
      padding: 10px 25px;
      background: white;
      color: black;
      text-decoration: none;
      font-weight: bold;
      border-radius: 0;
      font-size: 0.95rem;
      transition: background 0.3s ease;
    }

    .section .button:hover {
      background: #ddd;
    }

    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      font-size: 0.9rem;
      color: #aaa;
      background: black;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">Alexandra Hartinger</div>
    <nav>
      <a href="#about">About Me</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- David Yurman Section -->
  <div class="section">
    <video src="assets/DYCreateJoy.mp4" autoplay muted loop playsinline></video>
    <div class="overlay">
      <h1>David Yurman&nbsp;&nbsp;&nbsp;&nbsp;Holiday 2023 Campaign</h1>
      <a class="button" href="david-yurman.html">See More</a>
    </div>
  </div>

  <!-- NASCAR Section -->
  <div class="section">
    <video src="assets/CJM Daytona 1 (Beeps).mp4" autoplay muted loop playsinline></video>
    <div class="overlay">
      <h1>NASCAR&nbsp;&nbsp;&nbsp;&nbsp;x Main Street Auto</h1>
      <a class="button" href="nascar.html">See More</a>
    </div>
  </div>

  <!-- Main Street Auto Section -->
  <div class="section">
    <video src="assets/Brand Story Cover Video Shortened.mp4" autoplay muted loop playsinline></video>
    <div class="overlay">
      <h1>Main Street Auto</h1>
      <a class="button" href="mainstreetauto.html">See More</a>
    </div>
  </div>

  <footer>
    &copy; 2025 Alexandra Hartinger. All Rights Reserved.
  </footer>
</body>
</html>
