<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alexandra Hartinger Portfolio</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', sans-serif;
      background: black;
      color: white;
      overflow-x: hidden;
    }
    header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 10;
      background: black;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      box-sizing: border-box;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    header .logo {
      font-size: 1.8rem;
      font-weight: bold;
      text-transform: uppercase;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 30px;
      font-size: 1rem;
      text-transform: uppercase;
      font-weight: bold;
    }
    nav a:hover {
      color: #aaa;
    }
    .feature-section {
      position: relative;
      margin-bottom: 80px;
    }
    .feature-video {
      position: relative;
      width: 100%;
      height: 80vh;
      overflow: hidden;
      border-radius: 12px;
    }
    .feature-video video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .feature-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
    }
    .feature-overlay h2 {
      font-size: 3vw;
      margin-bottom: 20px;
      text-transform: uppercase;
      animation: fadeUp 1.2s ease forwards;
      opacity: 0;
    }
    .feature-overlay .learn-more {
      background: white;
      color: black;
      text-decoration: none;
      padding: 12px 24px;
      font-weight: bold;
      border-radius: 30px;
      transition: background 0.3s ease;
    }
    .feature-overlay .learn-more:hover {
      background: #ddd;
    }
    @keyframes fadeUp {
      from {
        transform: translate(-50%, -60%);
        opacity: 0;
      }
      to {
        transform: translate(-50%, -50%);
        opacity: 1;
      }
    }
    footer {
      text-align: center;
      padding: 40px 20px;
      font-size: 0.9rem;
      color: #aaa;
      background: black;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">Alexandra Hartinger</div>
    <nav>
      <a href="#">Home</a>
      <a href="#about">About Me</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- David Yurman Section -->
  <section class="feature-section">
    <div class="feature-video">
      <video src="assets/DYCreateJoy.mp4" autoplay muted loop playsinline></video>
      <div class="feature-overlay">
        <h2>David Yurman<br>Holiday 2023 Campaign</h2>
        <a href="david-yurman.html" class="learn-more">Learn More</a>
      </div>
    </div>
  </section>

  <!-- NASCAR Section -->
  <section class="feature-section">
    <div class="feature-video">
      <video src="assets/CJM Daytona 1 (Beeps).mp4" autoplay muted loop playsinline></video>
      <div class="feature-overlay">
        <h2>NASCAR x Main Street Auto</h2>
        <a href="nascar.html" class="learn-more">Learn More</a>
      </div>
    </div>
  </section>

  <!-- Main Street Auto Section -->
  <section class="feature-section">
    <div class="feature-video">
      <video src="assets/Brand Story Cover Video Shortened.mp4" autoplay muted loop playsinline></video>
      <div class="feature-overlay">
        <h2>Main Street Auto</h2>
        <a href="main-street-auto.html" class="learn-more">Learn More</a>
      </div>
    </div>
  </section>

  <footer>
    &copy; 2025 Alexandra Hartinger. All Rights Reserved.
  </footer>
</body>
</html>
