<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NASCAR x Main Street Auto</title>

<!-- Google Fonts for a bold, energetic style -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

<style>
  /* Reset and base styles */
  body, html {
    margin: 0; padding: 0;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #000;
    color: #fff;
    overflow-x: hidden;
  }

  /* Header with navigation */
  header {
    position: fixed; top: 0; width: 100%; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 40px;
    background: rgba(0,0,0,0.8);
    border-bottom: 1px solid rgba(255,255,255,0.2);
  }
  header .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.8rem; font-weight: bold; letter-spacing: 2px;
  }
  nav a {
    color: #fff;
    text-decoration: none;
    margin-left: 30px;
    font-family: 'Orbitron', sans-serif;
    font-weight: bold;
    font-size: 1rem;
    transition: color 0.3s;
  }
  nav a:hover { color: #ff0000; }

  /* Hero Section */
  .hero {
    height: 100vh;
    position: relative;
    overflow: hidden;
  }
  .hero video {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    filter: brightness(0.6);
    z-index: -1;
  }
  .hero-text {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    color: #fff;
    padding: 20px;
    animation: pulse 2s infinite;
  }
  .hero-text h1 {
    font-size: 3.5rem;
    margin-bottom: 20px;
    text-shadow: 0 0 15px #000, 0 0 30px #ff0000;
  }
  @keyframes pulse {
    0%, 100% { text-shadow: 0 0 10px #000, 0 0 20px #ff0000; }
    50% { text-shadow: 0 0 20px #000, 0 0 40px #ff0000; }
  }

  /* Sections styles */
section {
  padding: 80px 20px;
  max-width: 1200px;
  margin: 0 auto;
  background: #111;
}
h2.section-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 2.2rem;
  color: #fff;
  text-align: center;
  margin-bottom: 20px;
  letter-spacing: 2px;
  text-shadow: 0 0 10px #000;
}

/* Gallery styles */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 15px;
  padding: 10px;
}
.gallery img {
  width: 100%;
  border: 3px solid #ff0000;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
}
.gallery img:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px #ff0000;
}
