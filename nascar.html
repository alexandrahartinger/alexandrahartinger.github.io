<!DOCTYPE html>

  <title>NASCAR x Main Street Auto</title>
  <style>
    body, html {
      margin: 0; padding: 0;
      font-family: 'Helvetica Neue', sans-serif;
      background: black; color: white; overflow-x: hidden;
    }
    header {
      position: fixed; top: 0; width: 100%; z-index: 10;
      background: black;
      display: flex; justify-content: space-between;
      align-items: center; padding: 20px 40px; box-sizing: border-box;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    header .logo {
      font-size: 1.8rem; font-weight: bold; text-transform: uppercase;
    }
    nav a {
      color: white; text-decoration: none; margin-left: 30px;
      font-size: 1rem; text-transform: uppercase; font-weight: bold;
    }
    nav a:hover { color: #aaa; }
    .hero {
      position: relative; width: 100%; height: 100vh; overflow: hidden;
    }

    /* Header with video background */
    .hero {
      position: relative; width: 100%; height: 100vh; overflow: hidden;
    }
    .hero video {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: 0;
    }
    .hero h1 {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.5vw; text-align: center;
      z-index: 1; margin: 0;
      color: white;
      opacity: 0;
      animation: fadeUp 1.5s ease forwards;
      line-height: 1.2;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 2px;
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translate(-50%, -40%); }
      100% { opacity: 1; transform: translate(-50%, -50%); }
    }

    /* Style for YouTube embed & sections */
section {
  padding: 80px 40px;
  max-width: 1200px;
  margin: 0 auto;
}
section h2 {
  text-transform: uppercase;
  margin-bottom: 20px;
  text-align: center;
  font-size: 2rem;
}
.video-container {
  display: flex;
  justify-content: center;
  margin-top: 20px;
}
.video-container iframe {
  width: 100%;
  max-width: 800px;
  height: 450px;
  border-radius: 8px;
}
</style>
</head>
