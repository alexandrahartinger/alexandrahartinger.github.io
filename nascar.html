<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NASCAR x Main Street Auto</title>
  <style>
    body, html {
      margin: 0; padding: 0;
      font-family: 'Helvetica Neue', sans-serif;
      background: black; color: white; overflow-x: hidden;
    }
    header {
      position: fixed; top: 0; width: 100%; z-index: 10;
      background: black;
      display: flex; justify-content: space-between;
      align-items: center; padding: 20px 40px; box-sizing: border-box;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    header .logo {
      font-size: 1.8rem; font-weight: bold; text-transform: uppercase;
    }
    nav a {
      color: white; text-decoration: none; margin-left: 30px;
      font-size: 1rem; text-transform: uppercase; font-weight: bold;
    }
    nav a:hover { color: #aaa; }
    .hero {
      position: relative; width: 100%; height: 100vh; overflow: hidden;
    }
    .hero video {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; object-fit: cover; z-index: 0;
    }
    .hero h1 {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3vw; text-align: center;
      z-index: 1; margin: 0; color: white;
      opacity: 0; animation: fadeUp 1.5s ease forwards;
      line-height: 1.2;
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translate(-50%, -40%); }
      100% { opacity: 1; transform: translate(-50%, -50%); }
    }
    .video-container {
      padding: 80px 40px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .video-container video, .video-container iframe {
      width: 100%; border-radius: 8px; display: block;
    }
    section {
      padding: 80px 40px;
      max-width: 1200px;
      margin: 0 auto;
    }
    section h2 {
      text-transform: uppercase;
      margin-bottom: 20px;
      font-size: 2rem;
    }
    .carousel {
      display: flex; gap: 15px;
      overflow: hidden; animation: scroll 30s linear infinite;
    }
    .carousel img {
      flex: 0 0 auto;
      width: 25%; height: auto;
      object-fit: contain;
      border-radius: 8px;
    }
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .gallery {
      display: flex; flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .gallery img {
      width: calc(25% - 10px);
      border-radius: 8px;
      object-fit: cover;
    }
    .iphone-row {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .iphone-row img {
      width: 180px; border-radius: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Alexandra Hartinger</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="#about">About Me</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <div class="hero">
    <video src="assets/CJM Daytona 1 (Beeps).mp4" autoplay muted loop playsinline></video>
    <h1>NASCAR x Main Street Auto</h1>
  </div>

  <div class="video-container">
    <video src="assets/Meet Our Driver.mp4" autoplay muted loop playsinline></video>
  </div>

  <section>
    <h2>Hero Card Signing</h2>
    <div class="video-container">
      <video src="assets/Hero Card Singed.mp4" autoplay muted loop playsinline></video>
    </div>
  </section>

  <section>
    <h2>Hero Card Design</h2>
    <div style="display:flex; justify-content:center; gap:20px; flex-wrap:wrap;">
      <img src="assets/12.png" alt="Hero Card Front" style="width:250px;">
      <img src="assets/13.png" alt="Hero Card Back" style="width:250px;">
      <img src="assets/14.png" alt="Signing" style="width:180px;">
      <img src="assets/15.png" alt="Signing" style="width:180px;">
      <img src="assets/CJ SIG.png" alt="Signature" style="width:150px;">
    </div>
  </section>

  <section>
    <h2>Car Design</h2>
    <div class="carousel">
      <img src="assets/frontcar.png" alt="Front">
      <img src="assets/backcar.png" alt="Back">
      <img src="assets/sidecar.png" alt="Side">
      <img src="assets/sidecar2.png" alt="Side 2">
      <img src="assets/topcar.png" alt="Top">
    </div>
  </section>


  <div class="video-container">
    <video src="assets/Meet Our Driver.mp4" autoplay muted loop playsinline></video>
  </div>


  <section>
    <h2>Gallery</h2>
    <div class="gallery">
      <img src="assets/1.png" alt="1">
      <img src="assets/2.png" alt="2">
      <img src="assets/3.png" alt="3">
      <img src="assets/4.png" alt="4">
      <img src="assets/5.png" alt="5">
      <img src="assets/6.png" alt="6">
      <img src="assets/7.png" alt="7">
      <img src="assets/8.png" alt="8">
      <img src="assets/9.png" alt="9">
      <img src="assets/10.png" alt="10">
      <img src="assets/11.png" alt="11">
  
    </div>
  </section>

  <section>
    <h2>Reels Preview</h2>
    <div class="iphone-row">
      <img src="assets/iphone-placeholder1.png" alt="Reel 1">
      <img src="assets/iphone-placeholder2.png" alt="Reel 2">
      <img src="assets/iphone-placeholder3.png" alt="Reel 3">
    </div>
  </section>

  <footer>
    &copy; 2025 Alexandra Hartinger. All Rights Reserved.
  </footer>
</body>
</html>
