<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NASCAR x Main Street Auto</title>
<style>
body {
  margin: 0;
  font-family: 'Helvetica Neue', sans-serif;
  background: #000;
  color: #fff;
  overflow-x: hidden;
}
/* Hero styling similar to Yurman page */
.hero {
  position: relative;
  height: 100vh;
  width: 100%;
}
.hero iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  border: none;
  object-fit: cover;
  z-index: -1;
}
.hero h1 {
  position: absolute;
  top: 50%;
  width: 100%;
  text-align: center;
  font-family: 'Orbitron', sans-serif; /* similar font */
  font-size: 3vw; /* similar size */
  transform: translateY(-50%);
  color: #fff;
  margin: 0;
  padding: 0 20px;
  text-shadow: 0 0 10px #000, 0 0 20px #ff0000;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { text-shadow: 0 0 10px #000, 0 0 20px #ff0000; }
  50% { text-shadow: 0 0 20px #000, 0 0 40px #ff0000; }
}
</style>
</head>
<body>
<div class="hero">
  <!-- Embed YouTube as background iframe -->
  <iframe src="https://www.youtube.com/embed/2g8z9Tcm4hE?autoplay=1&mute=1&loop=1&playlist=2g8z9Tcm4hE&controls=0&showinfo=0&autohide=1&modestbranding=1" allow="autoplay; loop; fullscreen"></iframe>
  <h1>NASCAR x Main Street Auto</h1>
</div>
</body>
</html>
