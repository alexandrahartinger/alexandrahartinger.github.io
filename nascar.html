<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NASCAR x Main Street Auto</title>
<style>
body, html {
  margin: 0; padding: 0;
  font-family: 'Helvetica Neue', sans-serif;
  background: linear-gradient(to right, #f9d400, #e10600, #0072ce);
  color: white;
  overflow-x: hidden;
}

/* Header styles */
header {
  position: fixed; top: 0; width: 100%; z-index: 10;
  background: black;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  box-sizing: border-box;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
header .logo {
  font-size: 1.8rem;
  font-weight: bold;
  text-transform: uppercase;
}
nav a {
  color: white; text-decoration: none; margin-left: 30px;
  font-size: 1rem; text-transform: uppercase; font-weight: bold;
}
nav a:hover { color: #aaa; }

/* Hero video section */
.hero {
  position: relative; width: 100%; height: 100vh; overflow: hidden;
}
.hero video {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  z-index: 0;
}
.hero h1 {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 3vw;
  text-align: center;
  z-index: 1;
  margin: 0;
  color: white;
  opacity: 0;
  animation: fadeUp 1.5s ease forwards;
  line-height: 1.2;
}
@keyframes fadeUp {
  0% { opacity: 0; transform: translate(-50%, -40%); }
  100% { opacity: 1; transform: translate(-50%, -50%); }
}

/* Sections styling */
section {
  padding: 80px 40px;
  max-width: 1200px;
  margin: 0 auto;
  background: #111;
}
section h2 {
  text-transform: uppercase;
  margin-bottom: 20px;
  text-align: left;
  font-size: 2rem;
}
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
}
.gallery img {
  width: 100%;
  border-radius: 8px;
  border: 3px solid #ff0000;
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
}
.gallery img:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px #ff0000;
}
/* Flip card styles */
.flip-container {
  perspective: 1200px;
  max-width: 550px;
  margin: 0 auto;
  margin-top: 20px;
}
.card {
  position: relative;
  width: 100%;
  padding-top: 65%;
  transform-style: preserve-3d;
  transition: transform 0.8s ease;
  cursor: pointer;
}
.card.flipped {
  transform: rotateY(180deg);
  box-shadow: 0 20px 40px rgba(255,255,255,0.2);
}
.card .front, .card .back {
  position: absolute;
  top: 0; left:0; width: 100%; height: 100%;
  backface-visibility: hidden;
  border-radius: 12px;
  overflow: hidden;
}
.card .front img, .card .back img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.card .back {
  transform: rotateY(180deg);
}

/* Photos signing styles */
.signing-photos {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  margin-top: 40px;
}
.signing-photos img {
