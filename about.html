<style>
    /* ... (Keep your existing CSS above) ... */

    /* ===== Updated Stills / Resume Box CSS ===== */
    .stills-container {
      padding: 60px 5%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .stills-container h2 {
      text-transform: uppercase;
      margin-bottom: 25px;
      font-size: 2rem;
      font-weight: bold;
      font-family: 'Fraunces', serif;
    }

    .stills {
      display: flex;
      gap: 15px;
    }

    /* The Resume Box Container */
    .resume-box {
      position: relative;
      width: calc(33.333% - 10px); 
      aspect-ratio: 3/2; /* Keeps it consistent with other images */
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #222;
      cursor: pointer;
      background: #111;
    }

    .resume-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    /* The Standard Images in the row */
    .stills > img {
      width: calc(33.333% - 10px); 
      height: auto;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid #222;
    }

    /* Hover Overlay */
    .resume-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .resume-box:hover .resume-overlay {
      opacity: 1;
    }

    .resume-box:hover img {
      transform: scale(1.05);
    }

    .overlay-title {
        font-family: 'Fraunces', serif;
        font-size: 1.2rem;
        margin-bottom: 15px;
        color: #fff;
    }

    .btn-group {
        display: flex;
        gap: 10px;
    }

    .res-btn {
      padding: 8px 15px;
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      text-decoration: none;
      border-radius: 4px;
      transition: all 0.2s;
      letter-spacing: 1px;
    }

    .view-btn {
      background: #fff;
      color: #000;
    }

    .download-btn {
      border: 1px solid #fff;
      color: #fff;
    }

    .res-btn:hover {
      transform: translateY(-2px);
      filter: brightness(0.9);
    }

    @media (max-width: 768px) {
        .profile-section { grid-template-columns: 1fr; }
        .stills { flex-direction: column; }
        .stills img, .resume-box { width: 100%; height: 250px; }
    }
  </style>
</head>
<body>

  <section class="stills-container">
    <h2>Connect & Review</h2>
    <div class="stills">
      
      <div class="resume-box">
        <img src="assets/MOUNTAINME.png" alt="Resume Background"> 
        <div class="resume-overlay">
          <div class="overlay-title">Curriculum Vitae</div>
          <div class="btn-group">
            <a href="Resume2026.pdf" target="_blank" class="res-btn view-btn">View</a>
            <a href="Resume2026.pdf" download class="res-btn download-btn">Download</a>
          </div>
        </div>
      </div>

      <img src="assets/MOUNTAINME.png" alt="Colorado Views">
      <img src="assets/ASAP.png" alt="Pixel Design">
    </div>
  </section>
