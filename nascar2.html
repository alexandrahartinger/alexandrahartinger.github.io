<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/> 
  <title>NASCAR x Main Street Auto</title>
  <style>
    html { scroll-behavior: smooth; }
    body, html {
      margin: 0; padding: 0;
      font-family: 'Helvetica Neue', sans-serif;
      background: black; color: white; overflow-x: hidden;
    }
    header {
      position: fixed; top: 0; width: 100%; z-index: 10;
      background: black; display: flex; justify-content: space-between;
      align-items: center; padding: 20px 40px; box-sizing: border-box;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    header .logo { font-size: 1.8rem; font-weight: bold; text-transform: uppercase; }
    nav a { color: white; text-decoration: none; margin-left: 30px; font-size: 1rem; text-transform: uppercase; font-weight: bold; }
    nav a:hover { color: #aaa; }

    .hero { position: relative; width: 100%; height: 100vh; overflow: hidden; }
    .hero video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    .hero h1 { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2.5vw; text-align: center; z-index: 1; color: white; opacity: 0; animation: fadeUp 1.5s ease forwards; }
    @keyframes fadeUp { 0% { opacity: 0; transform: translate(-50%, -40%); } 100% { opacity: 1; transform: translate(-50%, -50%); } }

    section { padding: 80px 40px; max-width: 1200px; margin: 0 auto; }
    section:not(#team) h2 { text-transform: uppercase; margin-bottom: 20px; text-align: left; font-size: 2rem; }
    section#team h2, section#about h2 { text-transform: uppercase; margin-bottom: 20px; text-align: center; font-size: 2rem; }

    /* Car Carousel */
.car-carousel {
  position: relative;
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
}
.car-carousel img {
  width: 100%;
  max-width: 1200px;
  border-radius: 8px;
  display: block;
}
.carousel-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background-color: rgba(0,0,0,0.5);
  color: white;
  font-size: 2rem;
  padding: 10px;
  border: none;
  cursor: pointer;
  border-radius: 50%;
  z-index: 10;
}
.carousel-arrow.left { left: 10px; }
.carousel-arrow.right { right: 10px; }
.carousel-arrow:hover { background-color: rgba(0,0,0,0.8); }

    /* GALLERY CAROUSEL */
    .gallery-carousel { display: flex; flex-direction: column; gap: 20px; overflow: hidden; background: black; padding: 20px; border-radius: 10px; }
    .carousel-row { overflow: hidden; white-space: nowrap; }
    .carousel-track { display: inline-flex; animation: scroll-left 60s linear infinite; }
    .carousel-row.reverse .carousel-track { animation: scroll-right 60s linear infinite; }
    .carousel-track img { height: 200px; width: auto; margin-right: 10px; border-radius: 8px; object-fit: cover; }
    @keyframes scroll-left { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes scroll-right { from { transform: translateX(-50%); } to { transform: translateX(0); } }
    .carousel-row:hover .carousel-track { animation-play-state: paused; }

    /* SUPPORTING SOCIALS */
    #supporting-socials { padding: 80px 40px; max-width: 1200px; margin: 0 auto; }
    #supporting-socials h2 { text-transform: uppercase; margin-bottom: 30px; text-align: left; font-size: 2rem; }
    .socials-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .video-wrapper { position: relative; width: 100%; padding-top: 177.78%; overflow: hidden; border-radius: 12px; }

    .video-wrapper video,
.video-wrapper iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 12px;
  object-fit: cover;
}
    .video-container video, .video-container iframe {
      width: 100%;
      border-radius: 8px;
    }
    .video-container iframe {
      height: 675px;
    }


    /* HERO CARD FLIP */
    .flip-container { perspective: 1000px; width: 100%; max-width: 700px; aspect-ratio: 11 / 8.5; margin: 0 auto; position: relative; cursor: pointer; }
    .card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.8s ease; cursor: pointer; }
    .card.flipped { transform: rotateY(180deg); }
    .card .front, .card .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; overflow: hidden; }
    .card .back { transform: rotateY(180deg); }
    .card img { width: 100%; height: 100%; object-fit: cover; }

    footer { text-align: center; padding: 40px 20px; font-size: 0.9rem; color: #aaa; background: black; }
  </style>
</head>

<script>
  // Car Images for Branding Section
  const carImages = [
    "assets/CarTourThumbnail.jpg",
    "assets/frontcar.png",
    "assets/sidecar.png",
    "assets/backcar.png",
    "assets/topcar.png"
  ];
  let currentCarIndex = 0;

  function changeCarImage(direction) {
    currentCarIndex += direction;
    if (currentCarIndex < 0) currentCarIndex = carImages.length - 1;
    if (currentCarIndex >= carImages.length) currentCarIndex = 0;
    document.getElementById("carImage").src = carImages[currentCarIndex];
  }

  document.addEventListener('DOMContentLoaded', () => {
    // Flip Hero Card
    const heroCard = document.getElementById('heroCard');
    if (heroCard) {
      heroCard.addEventListener('click', () => heroCard.classList.toggle('flipped'));
    }

    // Scroll-triggered fade-ins
    const videos = document.querySelectorAll('.socials-container video, .socials-container iframe');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: 0.2 });
    videos.forEach(video => observer.observe(video));
  });
</script>
